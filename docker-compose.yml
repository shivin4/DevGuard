version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://devguard:devguard_pass@db:5432/devguard_db
      - GITHUB_WEBHOOK_SECRET=devguard_local_secret_key_123
      - LLM_PROVIDER=mock
      - LLM_MODEL=gemini-3.1-flash-lite
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=devguard
      - POSTGRES_PASSWORD=devguard_pass
      - POSTGRES_DB=devguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devguard -d devguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
